server {
    listen 80;
    resolver 127.0.0.11 valid=5s;
    include /etc/nginx/conf.d/active_target.inc;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$target_backend:3000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://$target_frontend:80;
        proxy_set_header Host $host;
    }
}
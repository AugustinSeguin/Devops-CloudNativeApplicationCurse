name: CI Pipeline

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  COVERAGE_THRESHOLD: 80
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/project

jobs:
  # ========== 1. QUALITY CHECKS ==========
  lint:
    name: Lint ${{ matrix.app }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        working-directory: ./${{ matrix.app }}
        run: npm install
      - name: Run ESLint
        working-directory: ./${{ matrix.app }}
        run: npm run lint -- --format json --output-file eslint-report.json
        continue-on-error: true

  test:
    name: Test ${{ matrix.app }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        working-directory: ./${{ matrix.app }}
        run: npm install
      - name: Run tests with coverage
        working-directory: ./${{ matrix.app }}
        run: npm test || echo "Tests failed but continuing for report"
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: ${{ matrix.app }}/coverage

  # ========== 2. DOCKER BUILD (TP 2.1) ==========
  docker-build:
    name: Build Docker Images
    runs-on: self-hosted
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: "Build Image (Tag: ci-build)"
        run: |
          docker build -t ${{ matrix.service }}:ci-build ./${{ matrix.service }}

  # ========== 3. SMOKE TESTS (TP 2.2) ==========
  smoke-tests:
    name: Smoke Tests (Health & Whoami)
    runs-on: self-hosted
    needs: docker-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create backend .env file
        run: |
          cat > backend/.env << EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER || 'myuser' }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'mypassword' }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB || 'gym_management' }}
          DATABASE_URL="postgresql://${{ secrets.POSTGRES_USER || 'myuser' }}:${{ secrets.POSTGRES_PASSWORD || 'mypassword' }}@postgres:5432/${{ secrets.POSTGRES_DB || 'gym_management' }}"
          PORT=3000
          NODE_ENV=production
          FRONTEND_URL=http://localhost
          EOF
      - name: Setup Environment
        run: |
          docker compose up -d
          sleep 15
      - name: Run Checks
        run: |
          echo "Checking Health Endpoint..."
          curl -f http://localhost/api/health || (docker compose logs backend && exit 1)
          echo "Checking Whoami Endpoint..."
          curl -f http://localhost/api/whoami || exit 1
      - name: Stop Environment
        if: always()
        run: docker compose down

  # ========== 4. PUBLISH TO GHCR (TP 2.3) ==========
  publish:
    name: Push to GHCR
    runs-on: self-hosted
    needs: smoke-tests
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        run: |
          IMAGE_ID=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE_ID:${{ github.sha }} -t $IMAGE_ID:latest ./${{ matrix.service }}
          docker push $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:latest

  # ========== 5. ANALYSIS & SUMMARY ==========
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: self-hosted
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage backend
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-backend
          path: backend/coverage
      - name: Download coverage frontend
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-frontend
          path: frontend/coverage
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

  summary:
    name: Pipeline Summary
    runs-on: self-hosted
    needs: [lint, test, smoke-tests, publish]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 Résumé du TP Docker & CI" >> $GITHUB_STEP_SUMMARY
          echo "| Étape | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Docker | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish GHCR | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY
